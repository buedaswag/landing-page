name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # NOTE: npm-audit, pip-audit, and gitleaks below are duplicated in
  # security.yml. Keep them in sync — audit levels, tool versions, and
  # Node/Python versions must match. If this starts drifting, extract
  # into a reusable workflow (workflow_call).
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    # Non-blocking: astro 5 advisories are now `critical` with no 5.x backport,
    # so this job fails until the astro 7 migration lands. See README backlog.
    # NOTE: this un-gates `deploy` (needs: npm-audit) — deploys proceed on a
    # failing audit. Remove once astro 7 lands.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Relaxed to `critical` while on astro 5 (open high astro + sharp
        # advisories only fixable via breaking astro 7 upgrade). Restore to
        # `high` after the astro 7 migration.
        run: npm audit --audit-level=critical

  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip audit
        run: pip-audit -r requirements.txt

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build site and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Serve dist
        run: npx serve dist -l 4444 &

      - name: Wait for server
        run: sleep 3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [npm-audit, pip-audit, gitleaks, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
