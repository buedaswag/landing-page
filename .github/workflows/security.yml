name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  # NOTE: npm-audit, pip-audit, and gitleaks below are duplicated in
  # deploy.yml. Keep them in sync — audit levels, tool versions, and
  # Node/Python versions must match. If this starts drifting, extract
  # into a reusable workflow (workflow_call).
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Relaxed to `critical` while on astro 5 (open high astro + sharp
        # advisories only fixable via breaking astro 7 upgrade). Restore to
        # `high` after the astro 7 migration.
        run: npm audit --audit-level=critical

  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip audit
        run: pip-audit -r requirements.txt

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
