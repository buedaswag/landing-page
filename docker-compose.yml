version: '3.8'

services:
  web:
    build: .
    ports:
      - "4444:4444"
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - blog-net
    command: >
      sh -c "npm install --package-lock-only && npm run dev -- --host 0.0.0.0 --port 4444"

networks:
  blog-net:
    driver: bridge

volumes:
  node_modules:
