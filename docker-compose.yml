version: '3.8'

services:
  web:
    build: .
    ports:
      - "4444:4444" # Ensure binding host port to container port
    environment:
      - HOST=0.0.0.0 # Properly expose container
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - blog-net # Add a dedicated network for isolation
    # Generate fresh package-lock.json before starting dev server
    command: >
      sh -c "npm install --package-lock-only && npm run build && npm run dev -- --host 0.0.0.0 --port 4444"

networks:
  blog-net:
    driver: bridge

volumes:
  node_modules:
