<svg width="1400" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff">
<style>
  text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  .th { font-size: 15px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; fill: #555; }
  .title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
  .subtitle { font-size: 13px; font-weight: 400; fill: #666; }
  .arr { stroke: #888; stroke-width: 1.5; }
  .assumption { font-size: 12px; fill: #444; }
  .injection { font-size: 13px; fill: #27500A; font-weight: 500; font-style: italic; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="title" x="700" y="35" text-anchor="middle">Evaporating cloud — the core conflict</text>
<text class="subtitle" x="700" y="55" text-anchor="middle">Having the right solution ≠ having a business. The evidence backs VSM. The market doesn't buy it.</text>

<!-- A: OBJECTIVE (center) -->
<rect x="510" y="90" width="380" height="70" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<text class="th" x="700" y="118" text-anchor="middle" fill="#27500A">A: Objective</text>
<text class="ts" x="700" y="140" text-anchor="middle" fill="#3B6D11">Build a sustainable business (money in the bank account)</text>

<!-- B: NEED 1 (left) -->
<rect x="100" y="220" width="380" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th" x="290" y="248" text-anchor="middle" fill="#0C447C">B: Sell what I know is right</text>
<text class="ts" x="290" y="268" text-anchor="middle" fill="#185FA5">VSM, flow, WIP management — DORA-backed, evidence-based</text>

<!-- C: NEED 2 (right) -->
<rect x="920" y="220" width="380" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="1110" y="248" text-anchor="middle" fill="#085041">C: Sell what people will pay for</text>
<text class="ts" x="1110" y="268" text-anchor="middle" fill="#0F6E56">Whatever the market is actually spending money on right now</text>

<!-- D: PREREQUISITE OF B (left bottom) -->
<rect x="100" y="360" width="380" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th" x="290" y="388" text-anchor="middle" fill="#0C447C">D: Keep positioning as VSM/flow expert</text>
<text class="ts" x="290" y="408" text-anchor="middle" fill="#185FA5">Lead with method, cite DORA, educate the market</text>

<!-- D': PREREQUISITE OF C (right bottom) -->
<rect x="920" y="360" width="380" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="1110" y="388" text-anchor="middle" fill="#085041">D': Sell something else entirely</text>
<text class="ts" x="1110" y="408" text-anchor="middle" fill="#0F6E56">Find what people buy, package around that</text>

<!-- ARROWS: A→B, A→C -->
<line x1="560" y1="160" x2="400" y2="220" class="arr" marker-end="url(#arrow)"/>
<line x1="840" y1="160" x2="1000" y2="220" class="arr" marker-end="url(#arrow)"/>

<!-- ARROWS: B→D, C→D' -->
<line x1="290" y1="290" x2="290" y2="360" class="arr" marker-end="url(#arrow)"/>
<line x1="1110" y1="290" x2="1110" y2="360" class="arr" marker-end="url(#arrow)"/>

<!-- CONFLICT LINE D ↔ D' -->
<line x1="480" y1="395" x2="920" y2="395" stroke="#A32D2D" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="700" y="385" text-anchor="middle" fill="#A32D2D" font-size="16" font-weight="700">⚡ CONFLICT ⚡</text>

<!-- ASSUMPTIONS BOX -->
<rect x="100" y="490" width="560" height="220" rx="12" fill="#F8F7F5" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="th" x="380" y="518" text-anchor="middle" fill="#2C2C2A">Hidden assumptions to challenge</text>

<text class="assumption" x="120" y="546">B→D: "If the research supports it, people will eventually buy it"</text>
<text class="assumption" x="140" y="566" fill="#888">→ A year of evidence says they won't. Research ≠ purchase orders.</text>

<text class="assumption" x="120" y="594">B→D: "I need to educate the market to create demand"</text>
<text class="assumption" x="140" y="614" fill="#888">→ Educating is a 3-5 year play. You need revenue now.</text>

<text class="assumption" x="120" y="642">C→D': "Selling what the market buys means abandoning my skills"</text>
<text class="assumption" x="140" y="662" fill="#888">→ Your skills (DevOps, flow, systems thinking) apply to many offerings.</text>

<text class="assumption" x="120" y="690">C→D': "I don't know what the market wants so I can't move to D'"</text>
<text class="assumption" x="140" y="710" fill="#888">→ This is the real blocker. The demand research answers it.</text>

<!-- INJECTION BOX -->
<rect x="720" y="490" width="580" height="220" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="1010" y="518" text-anchor="middle" fill="#27500A">Possible injection (UNVALIDATED)</text>

<text class="injection" x="740" y="550">Option A: Repackage VSM as AI-delivery-gap consulting</text>
<text class="assumption" x="740" y="570">Use DORA data as credibility, but sell the pain not the method.</text>
<text class="assumption" x="740" y="590">Risk: the pain may not be felt strongly enough to trigger buying.</text>

<text class="injection" x="740" y="620">Option B: Pivot to what IS selling (DevOps/platform/AI gigs)</text>
<text class="assumption" x="740" y="640">Use technical background to take freelance projects.</text>
<text class="assumption" x="740" y="660">Risk: competing on skills, not expertise. Lower differentiation.</text>

<text class="injection" x="740" y="690">Option C: Part-time job + part-time Flowtopia</text>
<text class="assumption" x="740" y="710">Stabilize income, continue building the practice on the side.</text>

<!-- WARNING BOX -->
<rect x="250" y="760" width="900" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="th" x="700" y="784" text-anchor="middle" fill="#633806">⚠ All three options require the same first step: find out what the market is actually spending on</text>
<text class="ts" x="700" y="804" text-anchor="middle" fill="#854F0B">The demand research (experiments 1-5) resolves the uncertainty that blocks all three paths</text>
</svg>
