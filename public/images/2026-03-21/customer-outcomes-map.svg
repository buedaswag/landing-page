<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff">
<style>
  text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  .col-head { font-size: 11px; font-weight: 400; fill: #888; }
  .col-title { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
  .card-title { font-size: 13px; font-weight: 600; }
  .card-sub { font-size: 11px; font-weight: 400; fill: #555; }
  .title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
  .subtitle { font-size: 13px; font-weight: 400; fill: #666; }
</style>

<text class="title" x="600" y="30" text-anchor="middle">Customer outcomes map  from a real mapping session</text>
<text class="subtitle" x="600" y="50" text-anchor="middle">UDEs, desires, and next steps in the customer's own words. Not hypothesized, not translated.</text>

<!-- Column headers -->
<text class="col-head" x="75" y="85" text-anchor="middle">What does success look like?</text>
<text class="col-title" x="75" y="108" text-anchor="middle">Outcome</text>

<text class="col-head" x="300" y="85" text-anchor="middle">What will we gain? Why this?</text>
<text class="col-title" x="300" y="108" text-anchor="middle">Benefits</text>

<text class="col-head" x="540" y="85" text-anchor="middle">What may slow our progress?</text>
<text class="col-title" x="540" y="108" text-anchor="middle">Obstacles</text>

<text class="col-head" x="870" y="85" text-anchor="middle">What next?</text>
<text class="col-title" x="870" y="108" text-anchor="middle">Next Steps</text>

<line x1="0" y1="120" x2="1200" y2="120" stroke="#E5E5E5" stroke-width="1"/>

<!-- COLUMN 1: Outcomes (green) -->
<rect x="10" y="135" width="180" height="70" rx="6" fill="#D4EDDA" stroke="#A3D9B1" stroke-width="0.8"/>
<text class="card-title" x="100" y="165" text-anchor="middle" fill="#1B5E20">Faster delivery</text>

<rect x="10" y="220" width="180" height="70" rx="6" fill="#D4EDDA" stroke="#A3D9B1" stroke-width="0.8"/>
<text class="card-title" x="100" y="245" text-anchor="middle" fill="#1B5E20">Improve quality</text>
<text class="card-sub" x="100" y="262" text-anchor="middle">(reduce churn)</text>

<!-- COLUMN 2: Benefits (cyan) -->
<rect x="210" y="135" width="180" height="70" rx="6" fill="#D1F2EB" stroke="#82D9C5" stroke-width="0.8"/>
<text class="card-title" x="300" y="160" text-anchor="middle" fill="#0E6655">Less unplanned</text>
<text class="card-title" x="300" y="177" text-anchor="middle" fill="#0E6655">work</text>

<rect x="210" y="220" width="180" height="85" rx="6" fill="#D1F2EB" stroke="#82D9C5" stroke-width="0.8"/>
<text class="card-title" x="300" y="248" text-anchor="middle" fill="#0E6655">More predictability</text>
<text class="card-sub" x="300" y="268" text-anchor="middle">(internal + customer)</text>

<rect x="210" y="320" width="180" height="85" rx="6" fill="#D1F2EB" stroke="#82D9C5" stroke-width="0.8"/>
<text class="card-title" x="300" y="345" text-anchor="middle" fill="#0E6655">Faster time to market</text>
<text class="card-sub" x="300" y="365" text-anchor="middle">"you will receive this feature</text>
<text class="card-sub" x="300" y="380" text-anchor="middle">at this point"</text>

<rect x="210" y="420" width="180" height="70" rx="6" fill="#D1F2EB" stroke="#82D9C5" stroke-width="0.8"/>
<text class="card-title" x="300" y="450" text-anchor="middle" fill="#0E6655">Cheaper delivery</text>

<!-- COLUMN 3: Obstacles (yellow) -->
<rect x="450" y="135" width="180" height="70" rx="6" fill="#FFF9C4" stroke="#F0E68C" stroke-width="0.8"/>
<text class="card-title" x="540" y="165" text-anchor="middle" fill="#7B6B00">Too much work</text>

<rect x="450" y="220" width="180" height="70" rx="6" fill="#FFF9C4" stroke="#F0E68C" stroke-width="0.8"/>
<text class="card-title" x="540" y="245" text-anchor="middle" fill="#7B6B00">Unclear</text>
<text class="card-title" x="540" y="262" text-anchor="middle" fill="#7B6B00">prioritization</text>

<!-- COLUMN 4: Next Steps (salmon)  two columns -->
<rect x="660" y="135" width="220" height="70" rx="6" fill="#FDCECE" stroke="#F4A7A7" stroke-width="0.8"/>
<text class="card-title" x="770" y="157" text-anchor="middle" fill="#8B1A1A">Have clear roles and</text>
<text class="card-title" x="770" y="174" text-anchor="middle" fill="#8B1A1A">responsibilities</text>

<rect x="660" y="220" width="220" height="85" rx="6" fill="#FDCECE" stroke="#F4A7A7" stroke-width="0.8"/>
<text class="card-title" x="770" y="248" text-anchor="middle" fill="#8B1A1A">Have clearer view on</text>
<text class="card-title" x="770" y="265" text-anchor="middle" fill="#8B1A1A">team-dependencies</text>

<rect x="660" y="320" width="220" height="85" rx="6" fill="#FDCECE" stroke="#F4A7A7" stroke-width="0.8"/>
<text class="card-title" x="770" y="345" text-anchor="middle" fill="#8B1A1A">Understand how the</text>
<text class="card-title" x="770" y="362" text-anchor="middle" fill="#8B1A1A">customer uses</text>
<text class="card-title" x="770" y="379" text-anchor="middle" fill="#8B1A1A">the platform</text>

<rect x="910" y="135" width="250" height="70" rx="6" fill="#FDCECE" stroke="#F4A7A7" stroke-width="0.8"/>
<text class="card-title" x="1035" y="157" text-anchor="middle" fill="#8B1A1A">What's getting in the way</text>
<text class="card-title" x="1035" y="174" text-anchor="middle" fill="#8B1A1A">of predictable delivery?</text>

<rect x="910" y="220" width="250" height="85" rx="6" fill="#FDCECE" stroke="#F4A7A7" stroke-width="0.8"/>
<text class="card-title" x="1035" y="248" text-anchor="middle" fill="#8B1A1A">Understand connections</text>
<text class="card-title" x="1035" y="265" text-anchor="middle" fill="#8B1A1A">between different</text>
<text class="card-title" x="1035" y="282" text-anchor="middle" fill="#8B1A1A">modules</text>

<rect x="910" y="320" width="250" height="70" rx="6" fill="#FDCECE" stroke="#F4A7A7" stroke-width="0.8"/>
<text class="card-title" x="1035" y="342" text-anchor="middle" fill="#8B1A1A" font-weight="700">Define value streams</text>
<text class="card-title" x="1035" y="362" text-anchor="middle" fill="#8B1A1A" font-weight="700">for product</text>

<!-- Annotation callouts -->
<line x1="540" y1="300" x2="540" y2="510" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="420" y="510" width="240" height="52" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="card-sub" x="540" y="530" text-anchor="middle" fill="#633806" font-weight="600">Maps to CRT root causes:</text>
<text class="card-sub" x="540" y="548" text-anchor="middle" fill="#854F0B">Too much WIP + No WIP limits</text>

<line x1="1035" y1="400" x2="1035" y2="510" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="880" y="510" width="310" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="card-sub" x="1035" y="530" text-anchor="middle" fill="#085041" font-weight="600">Customer asked for VSM by name:</text>
<text class="card-sub" x="1035" y="548" text-anchor="middle" fill="#0F6E56">"Define value streams for product"</text>

<text class="subtitle" x="600" y="600" text-anchor="middle">Source: mapping session with engineering organization. Names and company removed.</text>
</svg>
