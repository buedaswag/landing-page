<svg width="1400" height="1620" viewBox="0 0 1400 1620" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff">
<style>
  text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  .th { font-size: 15px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; fill: #555; }
  .title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
  .subtitle { font-size: 13px; font-weight: 400; fill: #666; }
  .arr { stroke: #888; stroke-width: 1.2; }
  .legend-text { font-size: 11px; fill: #444; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="title" x="700" y="35" text-anchor="middle">Current reality tree v3 — Flowtopia</text>
<text class="subtitle" x="700" y="55" text-anchor="middle">Read bottom-up: causes flow upward to produce effects. Each arrow = "if cause, then effect."</text>

<!-- TIER 1: TOP PAIN -->
<rect x="420" y="80" width="560" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text class="th" x="700" y="104" text-anchor="middle" fill="#791F1F">UDE-1: Business not sustainable</text>
<text class="ts" x="700" y="122" text-anchor="middle" fill="#A32D2D">One paying client in the past year — must job-search in parallel</text>

<!-- TIER 2: DIRECT CAUSES -->
<rect x="60" y="190" width="340" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="230" y="212" text-anchor="middle" fill="#712B13">UDE-4: No inbound demand</text>
<text class="ts" x="230" y="228" text-anchor="middle" fill="#993C1D">Nobody searching for VSM services</text>

<rect x="440" y="190" width="340" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="610" y="212" text-anchor="middle" fill="#712B13">UDE-5: Outreach neglected</text>
<text class="ts" x="610" y="228" text-anchor="middle" fill="#993C1D">Not enough volume of conversations</text>

<rect x="820" y="190" width="340" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="990" y="212" text-anchor="middle" fill="#712B13">UDE-6: Messaging doesn't convert</text>
<text class="ts" x="990" y="228" text-anchor="middle" fill="#993C1D">"Faster delivery" is what every consultant says</text>

<line x1="230" y1="190" x2="560" y2="136" class="arr" marker-end="url(#arrow)"/>
<line x1="610" y1="190" x2="660" y2="136" class="arr" marker-end="url(#arrow)"/>
<line x1="990" y1="190" x2="800" y2="136" class="arr" marker-end="url(#arrow)"/>

<!-- TIER 3: WHY NO DEMAND + WHY NO CONVERSION -->
<rect x="60" y="310" width="400" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="th" x="260" y="332" text-anchor="middle" fill="#633806">UDE-7: Consulting market contracting</text>
<text class="ts" x="260" y="348" text-anchor="middle" fill="#854F0B">Firms laying off. Overall freelance market -20% since 2023.</text>

<rect x="520" y="310" width="400" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="th" x="720" y="332" text-anchor="middle" fill="#633806">UDE-14: "Faster delivery" pitch is dead</text>
<text class="ts" x="720" y="348" text-anchor="middle" fill="#854F0B">Every consultant says it. Trust is low. Undifferentiated.</text>

<rect x="980" y="310" width="360" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="th" x="1160" y="332" text-anchor="middle" fill="#633806">UDE-12: VSM is unfamiliar to buyers</text>
<text class="ts" x="1160" y="348" text-anchor="middle" fill="#854F0B">Nobody searches for it or budgets for it</text>

<line x1="260" y1="310" x2="230" y2="242" class="arr" marker-end="url(#arrow)"/>
<line x1="260" y1="310" x2="610" y2="242" class="arr" marker-end="url(#arrow)"/>
<line x1="720" y1="310" x2="610" y2="242" class="arr" marker-end="url(#arrow)"/>
<line x1="720" y1="310" x2="990" y2="242" class="arr" marker-end="url(#arrow)"/>
<line x1="1160" y1="310" x2="230" y2="242" class="arr" marker-end="url(#arrow)"/>

<!-- TIER 4: MACRO FORCES -->
<rect x="60" y="430" width="300" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="210" y="454" text-anchor="middle" fill="#3C3489">UDE-8: Budgets shifted to AI</text>
<text class="ts" x="210" y="472" text-anchor="middle" fill="#534AB7">Learning &amp; consulting cut first. ~2 year trend.</text>

<rect x="400" y="430" width="300" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="550" y="454" text-anchor="middle" fill="#3C3489">UDE-11: Macro fear / wars</text>
<text class="ts" x="550" y="472" text-anchor="middle" fill="#534AB7">Leaders cut costs, lean out, avoid discretionary spend</text>

<rect x="740" y="430" width="300" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="890" y="454" text-anchor="middle" fill="#3C3489">UDE-9: AI replaces trust in people</text>
<text class="ts" x="890" y="472" text-anchor="middle" fill="#534AB7">Free, no pushback, always on, 24/7</text>

<rect x="1080" y="430" width="280" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="1220" y="454" text-anchor="middle" fill="#3C3489">UDE-10: DevOps interest fading</text>
<text class="ts" x="1220" y="472" text-anchor="middle" fill="#534AB7">Conferences dying. Category in decline.</text>

<line x1="210" y1="430" x2="260" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="430" x2="260" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="890" y1="430" x2="720" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="1220" y1="430" x2="720" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="1220" y1="430" x2="1160" y2="362" class="arr" marker-end="url(#arrow)"/>

<!-- TIER 5: NEW OBSERVATIONS — DORA-backed -->
<rect x="60" y="560" width="420" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="270" y="580" text-anchor="middle" fill="#085041">UDE-17: AI spend has no visible ROI</text>
<text class="ts" x="270" y="598" text-anchor="middle" fill="#0F6E56">80% of firms report no productivity impact (DORA 2025).</text>
<text class="ts" x="270" y="612" text-anchor="middle" fill="#0F6E56">Leaders can't connect AI investment to business results.</text>

<rect x="520" y="560" width="420" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="730" y="580" text-anchor="middle" fill="#085041">UDE-18: Leaders drowning / burning out</text>
<text class="ts" x="730" y="598" text-anchor="middle" fill="#0F6E56">40 action items/day. AI has zero effect on burnout or friction</text>
<text class="ts" x="730" y="612" text-anchor="middle" fill="#0F6E56">(DORA 2025). Higher expectations absorb any gains.</text>

<rect x="980" y="560" width="380" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="1170" y="580" text-anchor="middle" fill="#085041">UDE-20: German market saturated</text>
<text class="ts" x="1170" y="598" text-anchor="middle" fill="#0F6E56">Roles require German = enough local candidates.</text>
<text class="ts" x="1170" y="612" text-anchor="middle" fill="#0F6E56">-26% IT postings year-over-year (IW institute).</text>

<line x1="270" y1="560" x2="210" y2="490" class="arr" marker-end="url(#arrow)"/>
<line x1="730" y1="560" x2="890" y2="490" class="arr" marker-end="url(#arrow)"/>
<line x1="1170" y1="560" x2="1220" y2="490" class="arr" marker-end="url(#arrow)"/>

<!-- TIER 6: WHY DELIVERY PITCH FAILS -->
<rect x="60" y="700" width="420" height="66" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="th" x="270" y="720" text-anchor="middle" fill="#72243E">UDE-15: Companies fail at delivery but don't fix it</text>
<text class="ts" x="270" y="738" text-anchor="middle" fill="#993556">They know it. Watch departments fail. Still don't invest.</text>
<text class="ts" x="270" y="752" text-anchor="middle" fill="#993556">Even DORA-backed evidence doesn't change buying behavior.</text>

<rect x="520" y="700" width="420" height="66" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text class="th" x="730" y="720" text-anchor="middle" fill="#72243E">UDE-19: Kanban stripped to ceremonies</text>
<text class="ts" x="730" y="738" text-anchor="middle" fill="#993556">Lost WIP management purpose. Just status reporting.</text>
<text class="ts" x="730" y="752" text-anchor="middle" fill="#993556">The tool that should help exists but has been hollowed out.</text>

<line x1="270" y1="700" x2="270" y2="626" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="700" x2="730" y2="626" class="arr" marker-end="url(#arrow)"/>
<line x1="270" y1="700" x2="720" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="730" y1="700" x2="730" y2="626" class="arr" marker-end="url(#arrow)"/>

<!-- TIER 7: THE WIP HYPOTHESIS — DORA + Faros confirmed -->
<rect x="180" y="840" width="840" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="600" y="862" text-anchor="middle" fill="#27500A">UDE-16: AI amplifies existing dysfunction (DORA 2025 + Faros AI)</text>
<text class="ts" x="600" y="880" text-anchor="middle" fill="#3B6D11">90% adopted AI. Throughput up, but instability up too. Zero effect on burnout/friction.</text>
<text class="ts" x="600" y="894" text-anchor="middle" fill="#3B6D11">"Without VSM, AI creates localized pockets of productivity lost to downstream chaos." — DORA 2025</text>

<line x1="600" y1="840" x2="270" y2="766" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="840" x2="730" y2="766" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="840" x2="270" y2="626" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="840" x2="730" y2="626" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="840" x2="210" y2="490" class="arr" marker-end="url(#arrow)"/>

<!-- TIER 8: THE BUYING PROBLEM -->
<rect x="180" y="980" width="840" height="72" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="600" y="1000" text-anchor="middle" fill="#2C2C2A">The problem-solution fit exists. The buying behavior doesn't.</text>
<text class="ts" x="600" y="1018" text-anchor="middle" fill="#5F5E5A">DORA says VSM is a "force multiplier" for AI. The market still isn't buying it.</text>
<text class="ts" x="600" y="1032" text-anchor="middle" fill="#5F5E5A">Leaders don't see delivery as fixable. They treat it as weather, not engineering.</text>

<line x1="600" y1="980" x2="270" y2="766" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="980" x2="730" y2="766" class="arr" marker-end="url(#arrow)"/>

<!-- CORE PROBLEM -->
<rect x="250" y="1120" width="700" height="80" rx="14" fill="none" stroke="#A32D2D" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="270" y="1130" width="660" height="60" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
<text class="th" x="600" y="1154" text-anchor="middle" fill="#501313" font-size="16">CORE PROBLEM</text>
<text class="ts" x="600" y="1174" text-anchor="middle" fill="#791F1F" font-size="13">I know the solution. The evidence backs me. But the market isn't buying — and I don't know what they will buy.</text>

<line x1="600" y1="1052" x2="600" y2="1120" class="arr" marker-end="url(#arrow)"/>

<!-- REQUIRED NEXT STEP -->
<rect x="300" y="1260" width="600" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="600" y="1282" text-anchor="middle" fill="#27500A">Required next step</text>
<text class="ts" x="600" y="1300" text-anchor="middle" fill="#3B6D11">Find out what people are actually spending money on — not what the research says they should.</text>

<line x1="600" y1="1200" x2="600" y2="1260" class="arr" marker-end="url(#arrow)"/>

<!-- LEGEND -->
<text class="th" x="60" y="1400" fill="#333" font-size="13">Legend</text>
<rect x="60" y="1415" width="16" height="16" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.6"/>
<text class="legend-text" x="82" y="1428">Pain / top UDEs</text>
<rect x="200" y="1415" width="16" height="16" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text class="legend-text" x="222" y="1428">Direct causes</text>
<rect x="340" y="1415" width="16" height="16" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
<text class="legend-text" x="362" y="1428">Demand &amp; positioning</text>
<rect x="510" y="1415" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text class="legend-text" x="532" y="1428">Market forces</text>
<rect x="640" y="1415" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text class="legend-text" x="662" y="1428">DORA-backed observations</text>
<rect x="830" y="1415" width="16" height="16" rx="3" fill="#FBEAF0" stroke="#993556" stroke-width="0.6"/>
<text class="legend-text" x="852" y="1428">Why pitch fails</text>
<rect x="960" y="1415" width="16" height="16" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
<text class="legend-text" x="982" y="1428">Confirmed hypothesis</text>
<rect x="1130" y="1415" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text class="legend-text" x="1152" y="1428">Root cause</text>

<text class="subtitle" x="700" y="1470" text-anchor="middle">Sources: DORA 2025 State of AI-assisted Software Development (n=4,916), Faros AI Productivity Paradox Report,</text>
<text class="subtitle" x="700" y="1488" text-anchor="middle">freelancermap Kompass 2026, IW Institute Germany, qualitative interviews with engineering leaders.</text>
</svg>
